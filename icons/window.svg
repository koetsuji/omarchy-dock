<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fallback icon for a window no desktop entry claims (and that is neither an agent nor a
  terminal): a graphite tile, the same gradient as the other graphite tiles (#4A4A4F to
  #1C1C1E), and a simple white app-window glyph: a rounded rectangle with a title bar line.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4F"/>
      <stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#graphite)"/>
  <rect x="232" y="290" width="560" height="444" rx="72" ry="72" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <line x1="232" y1="420" x2="792" y2="420" stroke="#FFFFFF" stroke-width="40"/>
</svg>
